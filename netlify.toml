[build]
  command = "if [ -d \"frontend\" ]; then cd frontend; fi && npm install && npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"
  included_files = ["backend/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
