[build]
  command = "cd frontend && yarn install && CI=false yarn build"
  publish = "frontend/build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"
  GENERATE_SOURCEMAP = "false"
  MISE_PYTHON_AUTO_INSTALL = "0"

[functions]
  directory = "netlify/functions"
  included_files = ["backend/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
